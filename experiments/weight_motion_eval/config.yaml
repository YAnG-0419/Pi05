# Offline planning assumptions, NOT verified hardware operating limits.
# This tool cannot enable hardware output by changing a configuration flag.
schema_version: 1
hardware_output: false
source_hz: 30
sample_hz: 100
minimum_time_scale: 3.0
smoothing_passes: 2
max_total_seconds: 60.0
settle_seconds: 0.5
arm_raw_initial_delta_rad: 0.2
hand_raw_initial_delta_rad: null
max_smoothing_delta_rad:
  arm: 0.03
  hand: 0.08
approach:
  arm: {velocity: 0.15, acceleration: 0.3, jerk: 2.0}
  # Slower initial approach: 15 deg/s. Playback ceiling below is 30 deg/s.
  hand: {velocity: 0.2617993877991494, acceleration: 1.0, jerk: 5.0}
playback:
  arm: {velocity: 0.35, acceleration: 1.0, jerk: 10.0}
  # Per-joint software ceiling agreed for this trial: 30 deg/s = pi/6 rad/s.
  hand: {velocity: 0.5235987755982988, acceleration: 3.0, jerk: 30.0}
